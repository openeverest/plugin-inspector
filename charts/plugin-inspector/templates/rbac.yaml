apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "plugin-inspector.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plugin-inspector.labels" . | nindent 4 }}
---
# Cluster-wide because database namespaces are created dynamically. Read-only;
# the backend only serves pods of instances the caller can read via the Everest API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "plugin-inspector.fullname" . }}
  labels:
    {{- include "plugin-inspector.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "plugin-inspector.fullname" . }}
  labels:
    {{- include "plugin-inspector.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "plugin-inspector.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "plugin-inspector.fullname" . }}
    namespace: {{ .Release.Namespace }}
