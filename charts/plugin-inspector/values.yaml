replicaCount: 1

image:
  repository: ghcr.io/openeverest/plugin-inspector
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  port: 8080

plugin:
  displayName: "Inspector"
  description: "Pods, containers and logs of database instances."
  vendor: "OpenEverest"
  enabled: true
  bundlePath: "/main.js"
  compatibleUiContractVersions: "^18.0.0"
  extensionPoints:
    - type: clusterDetailTab
      path: inspector
      label: Inspector

# Optional override for the Everest API URL. When empty the backend discovers
# the everest Service via Kubernetes-injected env vars (same namespace), then
# falls back to http://everest.everest-system.svc.cluster.local:8080.
everestAPIURL: ""

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
